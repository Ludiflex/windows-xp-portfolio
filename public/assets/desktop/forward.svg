<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Sphere gradient -->
    <radialGradient id="greenSphere" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9bf38c" />
      <stop offset="40%" stop-color="#41c626" />
      <stop offset="85%" stop-color="#0e8300" />
      <stop offset="100%" stop-color="#075e00" />
    </radialGradient>
    <!-- Drop shadow for the sphere -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <!-- Glossy overlay -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Main Sphere (Centered at cx="16", cy="16") -->
  <circle cx="16" cy="16" r="12" fill="url(#greenSphere)" filter="url(#shadow)" stroke="#1a7c06" stroke-width="1"/>
  
  <!-- Glassy Highlight (Reflection - Centered at 16, 16) -->
  <path d="M 7 12 A 9 9 0 0 1 25 12 A 9 6 0 0 0 7 12 Z" fill="url(#gloss)" opacity="0.8"/>
  
  <!-- Right Arrow Shadow (Centered at 16, 16 with offset) -->
  <path d="M 14.5 10 L 20.5 16 L 14.5 22 L 14.5 18 L 9.5 18 L 9.5 14 L 14.5 14 Z" fill="#064f00" transform="translate(0.5, 0.5)"/>
  <!-- Right Arrow (Centered at 16, 16) -->
  <path d="M 14.5 10 L 20.5 16 L 14.5 22 L 14.5 18 L 9.5 18 L 9.5 14 L 14.5 14 Z" fill="#ffffff"/>
</svg>

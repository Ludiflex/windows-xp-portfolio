<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Folder gradients -->
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd55c"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffea9f"/>
      <stop offset="100%" stop-color="#ffce4b"/>
    </linearGradient>
    <!-- Glass lens gradient -->
    <radialGradient id="lens" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e3f2fd" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#90caf9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#42a5f5" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Folder Back Panel -->
  <path d="M 4,6 L 12,6 L 14,9 L 26,9 A 2,2 0 0 1 28,11 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,8 A 2,2 0 0 1 4,6 Z" fill="url(#folderBack)" filter="url(#shadow)"/>
  
  <!-- Document sticking out slightly -->
  <rect x="7" y="4" width="14" height="12" rx="1" fill="#ffffff" stroke="#b0bec5" stroke-width="1"/>
  <line x1="10" y1="8" x2="18" y2="8" stroke="#cfd8dc" stroke-width="1"/>
  <line x1="10" y1="11" x2="16" y2="11" stroke="#cfd8dc" stroke-width="1"/>

  <!-- Folder Front Flap -->
  <path d="M 2,12 L 26,12 A 2,2 0 0 1 28,14 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,12 Z" fill="url(#folderFront)"/>

  <!-- Magnifying Glass -->
  <!-- Handle -->
  <rect x="23" y="19" width="3" height="9" rx="1" fill="#4e342e" transform="rotate(-45 24.5 23.5)" filter="url(#shadow)"/>
  <rect x="23.5" y="19" width="2" height="3" rx="0.5" fill="#cfd8dc" transform="rotate(-45 24.5 23.5)"/>
  <!-- Rim -->
  <circle cx="16" cy="14" r="7" fill="none" stroke="#cfd8dc" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="16" cy="14" r="7" fill="none" stroke="#90a4ae" stroke-width="1"/>
  <!-- Lens -->
  <circle cx="16" cy="14" r="6" fill="url(#lens)"/>
  <!-- Highlight on lens -->
  <ellipse cx="14" cy="12" rx="2" ry="1.2" fill="#ffffff" opacity="0.6" transform="rotate(-30 14 12)"/>
</svg>

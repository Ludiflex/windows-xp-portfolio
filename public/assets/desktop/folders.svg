<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd55c"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffea9f"/>
      <stop offset="100%" stop-color="#ffce4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.8" dy="0.8" stdDeviation="0.6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Tree Lines -->
  <path d="M 8,11 L 8,21 L 13,21 M 8,16 L 13,16" fill="none" stroke="#78909c" stroke-width="1.5" stroke-dasharray="1.5,1.5"/>

  <!-- Parent Folder (top-left) -->
  <g transform="translate(2, 2) scale(0.65)">
    <!-- Back -->
    <path d="M 4,6 L 12,6 L 14,9 L 26,9 A 2,2 0 0 1 28,11 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,8 A 2,2 0 0 1 4,6 Z" fill="url(#folderBack)" filter="url(#shadow)"/>
    <!-- Front -->
    <path d="M 2,12 L 26,12 A 2,2 0 0 1 28,14 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,12 Z" fill="url(#folderFront)"/>
  </g>

  <!-- Child Folder 1 (middle-right) -->
  <g transform="translate(13, 10) scale(0.65)">
    <!-- Back -->
    <path d="M 4,6 L 12,6 L 14,9 L 26,9 A 2,2 0 0 1 28,11 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,8 A 2,2 0 0 1 4,6 Z" fill="url(#folderBack)" filter="url(#shadow)"/>
    <!-- Front -->
    <path d="M 2,12 L 26,12 A 2,2 0 0 1 28,14 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,12 Z" fill="url(#folderFront)"/>
  </g>

  <!-- Child Folder 2 (bottom-right) -->
  <g transform="translate(13, 17) scale(0.65)">
    <!-- Back -->
    <path d="M 4,6 L 12,6 L 14,9 L 26,9 A 2,2 0 0 1 28,11 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,8 A 2,2 0 0 1 4,6 Z" fill="url(#folderBack)" filter="url(#shadow)"/>
    <!-- Front -->
    <path d="M 2,12 L 26,12 A 2,2 0 0 1 28,14 L 28,24 A 2,2 0 0 1 26,26 L 4,26 A 2,2 0 0 1 2,24 L 2,12 Z" fill="url(#folderFront)"/>
  </g>
</svg>

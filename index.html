<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ludiflex | Portfolio</title>
  <link rel="icon" type="image/png" href="/assets/boot/favicon.png" />
  <link rel="stylesheet" href="/src/css/reset.css" />
  <link rel="stylesheet" href="/src/css/desktop.css" />
  <link rel="stylesheet" href="/src/css/window.css" />
  <link rel="stylesheet" href="/src/css/taskbar.css" />
  <link rel="stylesheet" href="/src/css/startmenu.css" />
  <link rel="stylesheet" href="/src/css/content.css" />
  <link rel="stylesheet" href="/src/css/responsive.css" />
  <link rel="stylesheet" href="/src/css/boot.css" />
</head>

<body>
  <!-- Boot Screen -->
  <div id="boot-screen">
    <div class="boot-logo">
      <img class="boot-xp-logo" src="/assets/boot/Windows-xp-logo.png" alt="Windows XP" draggable="false" />
      <img class="boot-wordmark" src="/assets/boot/portfolio-boot-wordmark.webp" alt="Ludiflex Portfolio" draggable="false" />
    </div>
    <div class="boot-progress">
      <div class="boot-progress-bar">
        <div class="boot-progress-block"></div>
        <div class="boot-progress-block"></div>
        <div class="boot-progress-block"></div>
      </div>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop">
    <!-- Desktop Icons -->
    <div id="desktop-icons">
      <div class="desktop-icon" data-window="about">
        <img class="desktop-icon-img" src="/assets/desktop/about.webp" alt="About Me" draggable="false" />
        <span class="desktop-icon-label">About Me</span>
      </div>
      <div class="desktop-icon" data-window="projects">
        <img class="desktop-icon-img" src="/assets/desktop/projects.webp" alt="Projects" draggable="false" />
        <span class="desktop-icon-label">Projects</span>
      </div>
      <div class="desktop-icon" data-window="skills">
        <img class="desktop-icon-img" src="/assets/desktop/Command Prompt.png" alt="Skills" draggable="false" />
        <span class="desktop-icon-label">Skills</span>
      </div>
      <div class="desktop-icon" data-window="resume">
        <img class="desktop-icon-img" src="/assets/desktop/resume.webp" alt="Resume" draggable="false" />
        <span class="desktop-icon-label">Resume</span>
      </div>
      <div class="desktop-icon" data-window="contact">
        <img class="desktop-icon-img" src="/assets/desktop/contact.webp" alt="Contact" draggable="false" />
        <span class="desktop-icon-label">Contact</span>
      </div>
      <div class="desktop-icon" data-window="mycomputer">
        <img class="desktop-icon-img" src="/assets/desktop/My Videos.png" alt="My Computer" draggable="false" />
        <span class="desktop-icon-label">My Computer</span>
      </div>
    </div>

    <!-- Windows Container -->
    <div id="windows-container"></div>

    <!-- Right-click Context Menu -->
    <div id="context-menu" class="context-menu hidden">
      <div class="context-menu-item" data-action="refresh">Refresh</div>
      <div class="context-menu-separator"></div>
      <div class="context-menu-item" data-action="about">About Me</div>
      <div class="context-menu-item" data-action="projects">Projects</div>
      <div class="context-menu-item" data-action="skills">Skills</div>
      <div class="context-menu-item" data-action="contact">Contact</div>
      <div class="context-menu-separator"></div>
      <div class="context-menu-item" data-action="properties">Properties</div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="start-button"></button>
    <div id="taskbar-buttons"></div>
    <div id="system-tray">
      <button id="fullscreen-toggle" title="Toggle Fullscreen">
        <img src="/assets/taskbar/fullscreen.webp" alt="Fullscreen" draggable="false" />
      </button>
      <button id="sound-toggle" title="Sound: Off">
        <img id="sound-icon" src="/assets/taskbar/notification-audio-volume-muted.png" alt="Sound" draggable="false" />
      </button>
      <span id="clock"></span>
    </div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu" class="hidden">
    <div class="start-menu-header">
      <div class="start-user-container">
        <img src="/assets/boot/user.png" alt="User" class="start-user-icon" draggable="false" />
      </div>
      <span class="start-user-name"></span>
    </div>
    <div class="start-menu-body">
      <div class="start-menu-left">
        <div class="start-menu-item bold" data-window="about">
          <img src="/assets/desktop/about.webp" alt="" draggable="false" />
          <div class="start-menu-item-text-container">
            <span class="start-menu-item-title">About Me</span>
            <span class="start-menu-item-sublabel">Bio & Info</span>
          </div>
        </div>
        <div class="start-menu-item bold" data-window="projects">
          <img src="/assets/desktop/projects.webp" alt="" draggable="false" />
          <div class="start-menu-item-text-container">
            <span class="start-menu-item-title">Projects</span>
            <span class="start-menu-item-sublabel">My Works</span>
          </div>
        </div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" data-window="skills">
          <img src="/assets/desktop/Command Prompt.png" alt="" draggable="false" />
          <div class="start-menu-item-text-container">
            <span class="start-menu-item-title">Skills</span>
            <span class="start-menu-item-sublabel">Tech Stack</span>
          </div>
        </div>
        <div class="start-menu-item" data-window="resume">
          <img src="/assets/desktop/resume.webp" alt="" draggable="false" />
          <div class="start-menu-item-text-container">
            <span class="start-menu-item-title">Resume</span>
            <span class="start-menu-item-sublabel">View Document</span>
          </div>
        </div>
        <div class="start-menu-item" data-window="contact">
          <img src="/assets/desktop/contact.webp" alt="" draggable="false" />
          <div class="start-menu-item-text-container">
            <span class="start-menu-item-title">Contact</span>
            <span class="start-menu-item-sublabel">Get in touch</span>
          </div>
        </div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item all-programs">
          <span>All Programs</span>
        </div>
      </div>
      <div class="start-menu-right">
        <div class="start-menu-item" data-window="mycomputer">
          <img src="/assets/desktop/My Videos.png" alt="" draggable="false" />
          <span>My Computer</span>
        </div>
        <div class="start-menu-item" data-window="resume">
          <img src="/assets/desktop/resume.webp" alt="" draggable="false" />
          <span>My Documents</span>
        </div>
        <div class="start-menu-item" data-window="contact">
          <img src="/assets/desktop/Email.png" alt="" draggable="false" />
          <span>Email</span>
        </div>
      </div>
    </div>
    <div class="start-menu-footer">
      <div class="start-footer-item" id="start-logoff">
        <img src="/assets/start-menu/logoff.webp" alt="" draggable="false" />
        <span>Log Off</span>
      </div>
      <div class="start-footer-item" id="start-shutdown">
        <img src="/assets/start-menu/restart.webp" alt="" draggable="false" />
        <span>Turn Off Computer</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
